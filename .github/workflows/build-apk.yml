name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight build of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Redirecting stdin from /dev/null keeps any unexpected prompt from
      # parking the runner until the job times out.
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --console=plain --stacktrace < /dev/null

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/slick-bt-keyboard-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/slick-bt-keyboard-release.apk
          ls -lh artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: slick-bt-keyboard-debug
          path: artifacts/slick-bt-keyboard-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: slick-bt-keyboard-release
          path: artifacts/slick-bt-keyboard-release.apk
          if-no-files-found: error

      # Actions artifacts are zipped and cannot be downloaded from a phone, so
      # every build also refreshes a release whose assets are the bare APKs.
      - name: Publish rolling download
        if: >-
          github.event_name == 'push' &&
          !startsWith(github.ref, 'refs/tags/') &&
          (github.ref_name == 'main' ||
           github.ref_name == 'claude/android-mobile-keyboard-app-a1tfg4')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-latest
          name: Slick BT Keyboard (latest build)
          body: |
            APK ล่าสุด build จาก `${{ github.sha }}`

            - `slick-bt-keyboard-release.apk` — แนะนำให้ใช้ตัวนี้
            - `slick-bt-keyboard-debug.apk` — มี log สำหรับ debug

            แตะที่ไฟล์ด้านล่างเพื่อโหลดและติดตั้งได้เลย
            (ต้องอนุญาต "ติดตั้งแอปที่ไม่รู้จัก" ให้เบราว์เซอร์ก่อน)
          files: artifacts/*.apk

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
