name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SoundPierce.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPierce-debug-apk
          path: SoundPierce.apk
          if-no-files-found: error

      - name: Publish Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: SoundPierce (latest debug build)
          body: |
            APK รุ่นล่าสุดของแอป "เสียงทะลุโหมดสั่น"
            ทำให้ LINE และสายโทรเข้ามีเสียงเรียกเข้าเสมอ แม้เปิดโหมดสั่น/เงียบ

            ดาวน์โหลดไฟล์ `SoundPierce.apk` ด้านล่างแล้วติดตั้งได้เลย
          files: SoundPierce.apk
          make_latest: true
